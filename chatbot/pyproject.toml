[project]
name = "chatbot"
version = "0.1.0"
description = "KinMel's LangChain-powered shopping assistant service"
readme = "README.md"
authors = [
    { name = "binaysharma1", email = "binaysharma0064@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
chatbot = "chatbot.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
